<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- Makes it open full-screen like a real app when launched from Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- This becomes the name under the icon on the home screen -->
  <meta name="apple-mobile-web-app-title" content="App Store">

  <!-- Replace this with your own hosted icon (180x180px, no transparency) -->
  <link rel="apple-touch-icon" href="https://yourserver.com/icon.png">

  <title>App Store</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: -apple-system, sans-serif;
      color: white;
    }
    button {
      padding: 20px 40px;
      font-size: 20px;
      font-weight: 600;
      color: white;
      background: #007AFF;
      border: none;
      border-radius: 14px;
      margin-bottom: 20px;
    }
    a.fallback {
      color: #888;
      font-size: 14px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <button onclick="installApp()">Install Now</button>

  <!-- Fallback in case the button doesn't trigger from the home-screen webview -->
  <a class="fallback" href="itms-services://?action=download-manifest&url=https://yourserver.com/manifest.plist">
    If nothing happens, tap here
  </a>

  <script>
    function installApp() {
      window.location.href = "itms-services://?action=download-manifest&url=https://yourserver.com/manifest.plist";
    }
  </script>
</body>
</html>
