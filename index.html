<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>App Store</title>
<link rel="icon" href="appstore.png">
<link rel="apple-touch-icon" href="appstore.png">
<style>
:root{--blue:#007aff;--text:#000;--gray:#8e8e93;--line:rgba(60,60,67,.16);--bar:rgba(249,249,249,.92);--safe:env(safe-area-inset-bottom,0px);--nav:84px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#fff;color:var(--text);touch-action:pan-y;overscroll-behavior-x:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}.app{width:100%;max-width:430px;min-height:100dvh;margin:auto;background:#fff;position:relative;overflow:hidden}.view{display:none;height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav) + var(--safe) + 18px)}.view.active{display:block}.categoryBody{width:100%;max-width:100%;overflow-x:hidden}.view img{max-width:100%}
button,input{font:inherit}.top{height:58px;padding:10px 20px 4px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:34px;line-height:1;font-weight:700;letter-spacing:-.7px}.avatar{width:32px;height:32px;border:0;padding:0;border-radius:50%;display:grid;place-items:center;background:#b6dce9;color:#fff;font-size:12px;font-weight:600}
.search-row{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.search-field{height:36px;flex:1;display:flex;align-items:center;gap:7px;padding:0 9px 0 10px;background:#efeff0;border-radius:10px}.search-field input{width:100%;border:0;outline:0;background:transparent;font-size:17px;color:#000}.search-field input::placeholder{color:#8e8e93}.cancel{border:0;background:none;color:var(--blue);font-size:17px;cursor:pointer}.clear{display:none;width:18px;height:18px;border:0;border-radius:50%;background:#8e8e93;color:#fff;place-items:center;cursor:pointer}.clear svg{width:10px;height:10px}
.section-title{padding:20px 20px 9px;font-size:22px;font-weight:700;letter-spacing:-.3px}.suggested{padding:0 16px}.row{display:flex;align-items:center;gap:13px;padding:10px 0;min-height:80px;border-bottom:.5px solid var(--line);cursor:pointer}.row:last-child{border-bottom:0}.icon{width:62px;height:62px;border-radius:14px;overflow:hidden;flex:none;background:#f2f2f7;box-shadow:0 1px 3px rgba(0,0,0,.13)}.icon img{width:100%;height:100%;display:block;object-fit:cover}.info{min-width:0;flex:1}.name{font-size:16px;font-weight:500;line-height:1.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:3px;font-size:13px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:7px;align-items:center;margin-top:5px;color:var(--gray);font-size:11px;white-space:nowrap;overflow:hidden}.stars{letter-spacing:-1px;color:#8e8e93}.action{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px}.btn{border:0;border-radius:16px;height:31px;min-width:69px;padding:0 14px;background:#e9e9ed;color:var(--blue);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.open{background:#e8f1ff}.tiny{font-size:10px;color:var(--gray)}
.browse{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px 24px}.card{height:96px;border-radius:14px;padding:14px;color:#fff;font-size:16px;font-weight:700;line-height:1.18;cursor:pointer;position:relative;overflow:hidden}.card:active{transform:scale(.985)}.c1{background:#5d9be3}.c2{background:#eb975f}.c3{background:#61bd7d}.c4{background:#9177df}.c5{background:#62b6dc}.c6{background:#e4bd54}.deco{position:absolute;right:10px;bottom:7px;font-size:28px}
.suggestions{list-style:none}.suggestion{padding:14px 20px;border-bottom:.5px solid var(--line);display:flex;align-items:center;gap:13px;font-size:17px;cursor:pointer}.suggestion:active{background:#f2f2f7}.sicon{width:22px;height:22px;display:grid;place-items:center;color:#8e8e93;flex:none}.sicon svg{width:20px;height:20px}
#categoryBody{padding:0 16px}#categoryBody .row{width:100%;min-width:0}.results-head{padding:10px 20px 6px;font-size:13px;color:var(--gray)}.featured{margin:6px 16px 18px;padding:15px;border-radius:17px;background:#f2f8ff}.feat-head{display:flex;gap:13px;align-items:flex-start}.feat-icon{width:62px;height:62px;border-radius:14px;overflow:hidden;flex:none}.feat-icon img{width:100%;height:100%;object-fit:cover}.feat-info{min-width:0;flex:1}.feat-name{font-size:17px;font-weight:600;line-height:1.2}.feat-sub{font-size:13px;color:var(--gray);margin-top:3px}.screens{display:flex;gap:10px;overflow-x:auto;margin-top:13px;scrollbar-width:none}.screens::-webkit-scrollbar{display:none}.screen{width:142px;aspect-ratio:9/19.5;flex:none;border-radius:14px;overflow:hidden;background:#fff}.screen img{width:100%;height:100%;object-fit:fill;display:block}
/* Natural iOS/App Store-style bottom tab bar. It stays inside the phone width. */
.tabbar{position:fixed;left:50%;bottom:0;transform:translate3d(-50%,0,0);width:min(100vw,430px);height:calc(var(--nav) + var(--safe));padding:6px 5px var(--safe);display:flex;align-items:flex-start;background:var(--bar);border-top:.5px solid rgba(60,60,67,.28);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);z-index:100}.tab{appearance:none;border:0;background:none;color:#8e8e93;flex:1;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;font-size:10px;line-height:12px;cursor:pointer}.tab.active{color:var(--blue)}.tab svg{width:24px;height:24px;margin-top:2px;margin-bottom:1px}.tab:active{opacity:.55}
.detail-nav{height:51px;display:flex;align-items:center;justify-content:space-between;padding:7px 16px;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.navbtn{width:34px;height:34px;border:0;border-radius:50%;background:#efeff0;display:grid;place-items:center;cursor:pointer}.navbtn svg{width:18px;height:18px}.detail-top{display:flex;gap:15px;padding:12px 20px 18px;align-items:flex-start}.big-icon{width:104px;height:104px;border-radius:23px;overflow:hidden;flex:none;box-shadow:0 3px 12px rgba(0,0,0,.12)}.big-icon img{width:100%;height:100%;object-fit:cover}.detail-main{min-width:0;flex:1}.detail-name{font-size:22px;line-height:1.12;font-weight:700;letter-spacing:-.4px}.detail-dev{font-size:15px;color:var(--gray);margin-top:4px}.detail-open{margin-top:13px}.detail-open .btn{background:var(--blue);color:#fff;min-width:86px;height:34px}.share-title{font-size:13px;color:var(--gray);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 4px;border-top:.5px solid var(--line);border-bottom:.5px solid var(--line);text-align:center}.stat-label{font-size:9px;color:var(--gray);text-transform:uppercase;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-value{font-size:18px;font-weight:600;margin-top:3px}.stat-sub{font-size:11px;color:var(--gray);margin-top:1px}.detail-section{padding:20px 20px 8px}.detail-section h2{font-size:22px;line-height:1.1;margin-bottom:10px}.version{display:flex;justify-content:space-between;color:var(--gray);font-size:14px;margin-bottom:9px}.description{font-size:15px;line-height:1.45}.preview-title{padding:18px 20px 10px;font-size:22px;font-weight:700}.preview{display:flex;gap:12px;overflow-x:auto;padding:0 20px 20px;scrollbar-width:none}.preview::-webkit-scrollbar{display:none}.preview-card{width:210px;aspect-ratio:9/19.5;flex:none;border-radius:17px;overflow:hidden;background:#fff}.preview-card img{width:100%;height:100%;object-fit:fill;display:block}.link-row{padding:13px 20px;border-top:.5px solid var(--line);font-size:15px;color:var(--blue);cursor:pointer}.loading{padding:22px;text-align:center;color:var(--gray);font-size:13px}.empty{padding:35px 20px;text-align:center;color:var(--gray)}
@media(min-width:431px){body{background:#f2f2f7}.app{height:100dvh;min-height:0;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}}

.orientation-lock{display:none}
@media (orientation:landscape){
  .orientation-lock{display:flex;position:fixed;inset:0;z-index:9999;background:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;font-weight:600}
  .app,.tabbar{display:none!important}
}

/* Account profile sheet */
.profile-sheet{
  position:fixed;inset:0;z-index:500;display:flex;align-items:flex-end;
  justify-content:center;background:rgba(0,0,0,.28);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s ease;
}
.profile-sheet.show{opacity:1;visibility:visible;pointer-events:auto}
.profile-card{
  width:min(100%,430px);background:rgba(249,249,249,.98);
  border-radius:18px 18px 0 0;padding:22px 20px calc(20px + var(--safe));
  text-align:center;box-shadow:0 -4px 25px rgba(0,0,0,.12);
  transform:translateY(18px);transition:transform .18s ease;
}
.profile-sheet.show .profile-card{transform:translateY(0)}
.profile-letter{
  width:64px;height:64px;border-radius:50%;margin:0 auto 12px;
  display:grid;place-items:center;background:#b6dce9;color:#fff;
  font-size:24px;font-weight:600;
}
.profile-card h3{font-size:22px;line-height:1.15;margin:0}
.profile-card p{font-size:15px;color:var(--gray);margin-top:5px}
.profile-close{
  width:100%;height:44px;margin-top:18px;border:0;border-radius:12px;
  background:#e9e9ed;color:var(--blue);font-size:17px;font-weight:600;cursor:pointer;
}

/* Search results use the same compact app-row proportions as the other tabs. */
#resultsBody{padding:0 16px}
#resultsBody .row{min-height:80px;padding:9px 0;gap:13px}
#resultsBody .icon{width:62px;height:62px;border-radius:14px}
#resultsBody .name{font-size:16px}
#resultsBody .sub{font-size:13px}
#resultsBody .meta{font-size:11px}
#resultsBody .btn{min-width:69px;height:31px}

/* Keep the featured horizontal screenshot strip compact and proportional. */
.featured{margin:6px 0 18px;padding:14px;border-radius:17px}
.screens{gap:9px;margin-top:12px;padding-bottom:2px}
.screen{width:128px;border-radius:13px}

/* Prevent any hidden account markup from taking layout space. */
.profile-sheet:not(.show){display:flex}

</style>
</head>
<body>
<div class="orientation-lock">Please rotate your phone back to portrait.</div>
<div class="app">
  <section id="home" class="view active">
    <div class="top"><h1>Search</h1><button class="avatar" aria-label="Account" onclick="showProfile()">A</button></div>
    <div class="search-row"><div class="search-field" onclick="startSearch()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input readonly placeholder="Games, Apps, Stories and More"></div></div>
    <div class="section-title">Suggested</div>
    <div id="suggested" class="suggested"></div>
    <div class="section-title">Browse</div>
    <div class="browse">
      <div class="card c1" onclick="switchTab('apps')">Top Downloaded Apps<div class="deco">🏆</div></div>
      <div class="card c2" onclick="switchTab('games')">Top Downloaded Games<div class="deco">🏆</div></div>
      <div class="card c3" onclick="searchFor('business')">Top-Selling Apps<div class="deco">🪙</div></div>
      <div class="card c4" onclick="searchFor('games')">Top-Selling Games<div class="deco">🪙</div></div>
      <div class="card c5" onclick="searchFor('productivity')">Productivity<div class="deco">✈️</div></div>
      <div class="card c6" onclick="searchFor('photo video')">Photo &amp; Video<div class="deco">📷</div></div>
    </div>
  </section>

  <section id="search" class="view">
    <div class="search-row"><div class="search-field"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="searchInput" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="clear" class="clear" onclick="clearSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><button class="cancel" onclick="switchTab('search')">Cancel</button></div>
    <ul id="suggestions" class="suggestions"></ul>
  </section>

  <section id="results" class="view"><div class="search-row"><div class="search-field"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="resultsInput" readonly><button class="clear" style="display:grid" onclick="startSearch(document.getElementById('resultsInput').value)"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><button class="cancel" onclick="switchTab('search')">Cancel</button></div><div id="resultsBody"></div></section>

  <section id="category" class="view"><div class="top"><h1 id="categoryTitle">Apps</h1><button class="avatar" aria-label="Account" onclick="showProfile()">A</button></div><div id="categoryBody" class="categoryBody"></div></section>

  <section id="detail" class="view"><div class="detail-nav"><button class="navbtn" onclick="back()"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><button class="navbtn" onclick="shareCurrent()"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></svg></button></div><div id="detailBody"></div></section>
</div>

<nav id="tabs" class="tabbar" aria-label="App Store navigation">
  <button class="tab" data-tab="today" onclick="switchTab('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg><span>Today</span></button>
  <button class="tab" data-tab="games" onclick="switchTab('games')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 8.5l-2-2M15.5 8.5l2-2M8 13h-3M19 13h-3"/><path d="M7 18c-2.3 0-3.4-1.7-2.8-3.8l1.5-5.1C6.2 7 7.6 6 9.5 6h5c1.9 0 3.3 1 3.8 3.1l1.5 5.1C20.4 16.3 19.3 18 17 18c-1.3 0-2.3-.6-3.1-1.8L13 15h-2l-.9 1.2C9.3 17.4 8.3 18 7 18z"/></svg><span>Games</span></button>
  <button class="tab" data-tab="apps" onclick="switchTab('apps')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8-4 8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg><span>Apps</span></button>
  <button class="tab" data-tab="arcade" onclick="switchTab('arcade')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l8-4 8 4-8 4-8-4z"/><path d="M4 14l8 4 8-4"/><circle cx="12" cy="9" r="1.2"/></svg><span>Arcade</span></button>
  <button class="tab active" data-tab="search" onclick="switchTab('search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.2"/><path d="M15.2 15.2L20 20"/></svg><span>Search</span></button>
</nav>

<div id="profileSheet" class="profile-sheet" onclick="closeProfile(event)">
  <div class="profile-card" onclick="event.stopPropagation()">
    <div class="profile-letter">A</div>
    <h3>Account</h3>
    <p>Your App Store profile</p>
    <button class="profile-close" onclick="showProfile(false)">Done</button>
  </div>
</div>

<script>
const API='https://itunes.apple.com';
const localService={name:'Service NSW'};
let currentView='home',previousView='results',currentApp=null,searchTimer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const ratingStars=n=>{n=Math.round(Number(n)||0);return '★'.repeat(Math.max(0,Math.min(5,n)))+'☆'.repeat(5-Math.max(0,Math.min(5,n)))};
const compact=n=>{n=Number(n)||0;if(n>=1000000)return (n/1000000).toFixed(1).replace('.0','')+'M';if(n>=1000)return (n/1000).toFixed(n>=100000?'0':'1').replace('.0','')+'K';return n?String(n):''};
const age=v=>v||'—';
const price=a=>a.formattedPrice||((a.price===0)?'Free':'');

function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('timeout'))},12000);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=data=>{cleanup();resolve(data)};s.onerror=()=>{cleanup();reject(new Error('network'))};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s)})}
async function searchApps(term,limit=50){
  term=String(term||'').trim();
  if(!term)return [];
  const url=API+'/search?term='+encodeURIComponent(term)+'&country=au&media=software&entity=software&limit='+limit+'&lang=en_au';
  const data=await jsonp(url);
  return (data.results||[]).filter(x=>x.wrapperType==='software' && x.trackId);
}
async function lookupApp(id){const data=await jsonp(API+'/lookup?id='+encodeURIComponent(id)+'&country=au&entity=software');return data.results?.find(x=>x.wrapperType==='software')||null}

function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);currentView=id}
function setTab(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab))}
async function switchTab(tab){
  if(tab==='search'){setTab('search');show('home');return}
  setTab(tab);
  if(tab==='today'){renderCategory('Today','featured','top charts');return}
  if(tab==='games'){renderCategory('Games','games','games');return}
  if(tab==='apps'){renderCategory('Apps','apps','apps');return}
  if(tab==='arcade'){renderCategory('Arcade','arcade','arcade games');return}
}
async function renderCategory(title,type,term){show('category');document.getElementById('categoryTitle').textContent=title;const b=document.getElementById('categoryBody');b.innerHTML='<div class="loading">Loading App Store apps…</div>';try{let list=await searchApps(term,30);if(type==='games')list=list.filter(x=>/game/i.test(x.primaryGenreName||''));if(type==='apps')list=list.filter(x=>!/game/i.test(x.primaryGenreName||''));list=list.slice(0,18);b.innerHTML=list.map(appRow).join('')||'<div class="empty">No apps found.</div>'}catch(e){b.innerHTML='<div class="empty">Could not load the App Store catalogue right now.</div>'}}
function appRow(a){
  const id=a.trackId;
  const isService=/^Service NSW$/i.test(a.trackName||'');
  const actionLabel=isService?'Open':(price(a)==='Free'?'Get':price(a)||'Get');
  const actionClass=isService?'btn open':'btn';
  const storeUrl=isService?'servicensw://':(a.trackViewUrl||appStoreWebUrl(a));
  return `<div class="row" onclick="openApp(${id})">
    <div class="icon"><img src="${esc(a.artworkUrl512||a.artworkUrl100||'')}" loading="lazy" alt=""></div>
    <div class="info"><div class="name">${esc(a.trackName)}</div><div class="sub">${esc(a.artistName||a.sellerName||a.primaryGenreName||'App')}</div>
      <div class="meta"><span class="stars">${ratingStars(a.averageUserRating)}</span><span>${compact(a.userRatingCount)}</span><span>${esc(a.primaryGenreName||'')}</span></div>
    </div>
    <div class="action"><button class="${actionClass}" onclick="event.stopPropagation();openStore('${esc(a.trackViewUrl||'')}')">${actionLabel}</button></div>
  </div>`;
}

function startSearch(initial=''){show('search');setTab('search');const i=document.getElementById('searchInput');i.value=initial||'';renderSuggestions(initial||'');i.focus()}
function clearSearch(){document.getElementById('searchInput').value='';renderSuggestions('');document.getElementById('searchInput').focus()}
let suggestionRequest=0;
function suggestionRow(label, sub=''){
  return `<li class="suggestion" onclick="searchFor('${esc(label).replace(/'/g,"\\'")}')">
    <span class="sicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
    <span><div>${esc(label)}</div>${sub?`<div style="font-size:12px;color:#8e8e93;margin-top:2px">${esc(sub)}</div>`:''}</span>
  </li>`;
}
async function renderSuggestions(q){
  const ul=document.getElementById('suggestions');
  const term=String(q||'').trim();
  if(!term){ul.innerHTML='';return}
  ul.innerHTML='<li class="suggestion"><span class="sicon">⌕</span><span>Searching…</span></li>';
  const request=++suggestionRequest;
  try{
    const list=await searchApps(term,10);
    if(request!==suggestionRequest)return;
    const seen=new Set();
    const matches=list.filter(a=>{
      const key=(a.trackName||'').toLowerCase();
      if(!key||seen.has(key))return false;
      seen.add(key); return true;
    }).slice(0,8);
    ul.innerHTML=matches.map(a=>suggestionRow(a.trackName,a.artistName||a.primaryGenreName||'')).join('') ||
      suggestionRow(term,'Search App Store');
  }catch(e){
    if(request===suggestionRequest) ul.innerHTML=suggestionRow(term,'Search App Store');
  }
}
document.getElementById('searchInput').addEventListener('input',e=>{
  const value=e.target.value;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>renderSuggestions(value),180);
});
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())searchFor(e.target.value.trim())});

async function searchFor(term){
  term=String(term||'').trim();
  if(!term)return;
  show('results');
  setTab('search');
  document.getElementById('resultsInput').value=term;
  const body=document.getElementById('resultsBody');
  body.innerHTML='<div class="loading">Searching the App Store…</div>';
  try{
    const list=await searchApps(term,50);
    const exact=list.find(a=>String(a.trackName||'').toLowerCase()===term.toLowerCase());
    const rest=exact?list.filter(a=>a.trackId!==exact.trackId):list;
    body.innerHTML=(exact?featuredRow(exact):'')+
      rest.map(appRow).join('')+
      (!exact&&!rest.length?'<div class="empty">No apps found for “'+esc(term)+'”.</div>':'');
  }catch(e){
    body.innerHTML='<div class="empty">Could not reach the App Store search service. Check your connection and try again.</div>';
  }
}
function featuredRow(a){return `<div class="featured" onclick="openApp(${a.trackId})"><div class="feat-head"><div class="feat-icon"><img src="${esc(a.artworkUrl512||a.artworkUrl100||'')}" alt=""></div><div class="feat-info"><div class="feat-name">${esc(a.trackName)}</div><div class="feat-sub">${esc(a.artistName||a.sellerName||a.primaryGenreName||'')}</div><div class="meta"><span class="stars">${ratingStars(a.averageUserRating)}</span><span>${compact(a.userRatingCount)}</span><span>${esc(a.primaryGenreName||'')}</span></div></div><button class="btn open" onclick="event.stopPropagation();openStore('${esc(/^Service NSW$/i.test(a.trackName)?'servicensw://':(a.trackViewUrl||appStoreWebUrl(a)))}')">${/^Service NSW$/i.test(a.trackName)?'Open':(price(a)==='Free'?'Get':price(a)||'Get')}</button></div><div class="screens">${(a.screenshotUrls||[]).slice(0,3).map(s=>`<div class="screen"><img src="${esc(s)}" alt=""></div>`).join('')}</div></div>`}

async function openApp(id){previousView=currentView;show('detail');const b=document.getElementById('detailBody');b.innerHTML='<div class="loading">Loading app profile…</div>';try{const a=await lookupApp(id);if(!a){b.innerHTML='<div class="empty">App details could not be loaded.</div>';return}currentApp=a;renderDetail(a)}catch(e){b.innerHTML='<div class="empty">Could not load this app profile.</div>'}}
function renderDetail(a){const icon=/^Service NSW$/i.test(a.trackName)?localService.icon:(a.artworkUrl512||a.artworkUrl100||'');const screenshots=a.screenshotUrls||[];document.getElementById('detailBody').innerHTML=`
<div class="detail-top"><div class="big-icon"><img src="${esc(icon)}" alt="${esc(a.trackName)}"></div><div class="detail-main"><div class="detail-name">${esc(a.trackName)}</div><div class="detail-dev">${esc(a.artistName||a.sellerName||'')}</div><div class="detail-open"><button class="btn" style="background:#007aff;color:#fff" onclick="openStore('${esc(/^Service NSW$/i.test(a.trackName)?'servicensw://':(a.trackViewUrl||appStoreWebUrl(a)))}')">${/^Service NSW$/i.test(a.trackName)?'Open':(price(a)==='Free'?'Get':price(a)||'Get')}</button></div><div class="share-title">${esc(a.primaryGenreName||'App')}</div></div></div>
<div class="stats"><div><div class="stat-label">Ratings</div><div class="stat-value">${compact(a.userRatingCount)||'—'}</div><div class="stat-sub">${a.averageUserRating?Number(a.averageUserRating).toFixed(1)+' '+ratingStars(a.averageUserRating):'No ratings'}</div></div><div><div class="stat-label">Age Rating</div><div class="stat-value">${esc(age(a.trackContentRating))}</div><div class="stat-sub">Age</div></div><div><div class="stat-label">Version</div><div class="stat-value" style="font-size:15px">${esc(a.version||'—')}</div><div class="stat-sub">${a.currentVersionReleaseDate?new Date(a.currentVersionReleaseDate).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):''}</div></div><div><div class="stat-label">Category</div><div class="stat-value" style="font-size:13px">${esc(a.primaryGenreName||'—')}</div><div class="stat-sub">App Store</div></div></div>
<div class="detail-section"><h2>What’s New</h2><div class="version"><span>Version ${esc(a.version||'')}</span><span>${a.currentVersionReleaseDate?new Date(a.currentVersionReleaseDate).toLocaleDateString('en-AU',{day:'numeric',month:'short'}):''}</span></div><p class="description">${esc(a.releaseNotes||'No release notes are available for this version.')}</p></div>
<div class="detail-section"><h2>Information</h2><p class="description">${esc(a.description||'No description available.')}</p></div>
<div class="preview-title">Preview</div><div class="preview">${screenshots.map(s=>`<div class="preview-card"><img src="${esc(s)}" alt=""></div>`).join('')||'<div class="empty">No preview images available.</div>'}</div>
${a.sellerUrl?`<div class="link-row" onclick="window.open('${esc(a.sellerUrl)}','_blank','noopener')">Developer Website</div>`:''}
<div class="link-row" onclick="openStore('${esc(/^Service NSW$/i.test(a.trackName)?'servicensw://':(a.trackViewUrl||appStoreWebUrl(a)))}')">${/^Service NSW$/i.test(a.trackName)?'Open Service NSW':'View on the App Store'}</div>`}
function appStoreWebUrl(a){
  if(!a)return 'https://apps.apple.com/au/';
  if(a.trackViewUrl && /^https:\/\/apps\.apple\.com\//i.test(a.trackViewUrl)) return a.trackViewUrl;
  const name=encodeURIComponent(a.trackName||'');
  return `https://apps.apple.com/au/search?term=${name}`;
}
function openStore(url){
  if(!url)return;
  // Service NSW intentionally uses its custom URL scheme.
  if(/^servicensw:\/\//i.test(url)){ window.location.href=url; return; }
  // Normal apps are forced to the browser-based Australian App Store website.
  let target=url;
  if(!/^https:\/\/apps\.apple\.com\//i.test(target)){
    target='https://apps.apple.com/au/';
  }
  window.open(target,'_blank','noopener,noreferrer');
}
function openExternalApp(name){searchFor(name)}
function getApp(name){searchFor(name)}
function shareCurrent(){if(!currentApp)return;const url=currentApp.trackViewUrl||location.href;if(navigator.share)navigator.share({title:currentApp.trackName,url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>alert('App Store link copied.')).catch(()=>{})}
function back(){show(previousView||'results')}
function showProfile(open=true){
  document.getElementById('profileSheet').classList.toggle('show',open);
}
function closeProfile(e){
  if(e.target.id==='profileSheet') showProfile(false);
}
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});


/* Seed the search screen with the same familiar suggestions, but all actual result cards are live App Store data. */
(async function init(){
  try{
    const [temu, games] = await Promise.all([
      searchApps('temu', 8),
      searchApps('games', 20)
    ]);
    const temuApp = temu.find(a => /temu/i.test(a.trackName || ''));
    const gameApps = games
      .filter(a => /game/i.test(a.primaryGenreName || ''))
      .filter((a,i,arr) => arr.findIndex(x => x.trackId === a.trackId) === i)
      .slice(0,2);
    const defaults = [temuApp, ...gameApps].filter(Boolean).slice(0,3);
    document.getElementById('suggested').innerHTML = defaults.map(appRow).join('') ||
      '<div class="empty">Suggestions will appear when connected.</div>';
  }catch(e){
    document.getElementById('suggested').innerHTML='<div class="empty">Suggestions will appear when connected.</div>';
  }
})();
// Keep the app in portrait mode where the browser exposes orientation locking.
async function lockPortrait(){
  try{
    if(screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('portrait');
    }
  }catch(e){}
}
lockPortrait();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lockPortrait()});
</script>
